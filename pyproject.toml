[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opatchbot"
version = "0.1.0"
description = "Detect Oracle CPU/CSPU releases and stage this site's patches from My Oracle Support"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "playwright>=1.45",
  "pyotp>=2.9",
  "PyYAML>=6",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
opatchbot = "opatchbot.cli:main"

[tool.setuptools.packages.find]
include = ["opatchbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
